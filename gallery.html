<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runyu Lu | Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="gallery">
    <div id="header-placeholder"></div>

    <main>
      <section class="section page-header">
        <div class="container narrow">
          <h1>Gallery</h1>
          <p class="page-subtitle">
            Photos from research life, conferences, and travels. I’ll continue updating this
            collection as new projects unfold.
          </p>
        </div>
      </section>

      <section class="section muted">
        <div class="container">
          <div class="gallery-grid">
            <figure>
              <img src="assets/IMG_SF.JPG" alt="Runyu Lu at Fisherman’s Wharf in San Francisco." />
              <figcaption>San Francisco · 2025</figcaption>
            </figure>
            <figure class="placeholder">
              <div class="placeholder-box">Conference highlights</div>
            </figure>
            <figure class="placeholder">
              <div class="placeholder-box">Lab life moments</div>
            </figure>
            <figure class="placeholder">
              <div class="placeholder-box">Robotics demos</div>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/components.js"></script>
  </body>
</html>
